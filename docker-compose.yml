version: '3.8'

services:
  food-delivery-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-delivery-microservices
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/restaurants/cuisines"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - food-delivery-net

networks:
  food-delivery-net:
    driver: bridge
