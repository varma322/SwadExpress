name: Food Delivery Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Automated Testing (10 Core Use Cases)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up OpenJDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Grant Execute Permission for Maven Wrapper
      run: chmod +x backend/mvnw

    - name: Compile & Run Automated Integration Tests
      working-directory: ./backend
      run: ./mvnw clean test

    - name: Package Spring Boot Executable JAR
      working-directory: ./backend
      run: ./mvnw package -DskipTests

    - name: Build Docker Container
      run: docker build -t food-delivery-backend:latest backend/

    - name: Verify Docker Compose Configuration
      run: docker compose config
